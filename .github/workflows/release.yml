name: Recover v1.5.16 Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Package the v1.5.16 Windows installer
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ISHELL_MANAGEMENT_URL: ${{ vars.ISHELL_MANAGEMENT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.5.16
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Fetch and verify the official WiX and NSIS tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PYTOOLS'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import time
          from zipfile import ZipFile

          def fetch(repo, asset, path, sha256=None, sha1=None):
              for attempt in range(3):
                  try:
                      with path.open("wb") as stream:
                          subprocess.run(
                              ["gh", "api", "-H", "Accept: application/octet-stream",
                               f"repos/{repo}/releases/assets/{asset}"],
                              stdout=stream, check=True, timeout=90,
                          )
                      break
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                      if attempt == 2:
                          raise
                      time.sleep((attempt + 1) * 3)
              data = path.read_bytes()
              if sha256 is not None and hashlib.sha256(data).hexdigest() != sha256:
                  raise RuntimeError(f"SHA-256 mismatch for {path.name}")
              if sha1 is not None and hashlib.sha1(data).hexdigest() != sha1:
                  raise RuntimeError(f"SHA-1 mismatch for {path.name}")
              print(f"Verified {path.name}", flush=True)

          cache = Path(os.environ["LOCALAPPDATA"]) / "tauri"
          cache.mkdir(parents=True, exist_ok=True)
          with tempfile.TemporaryDirectory() as tmp:
              temp = Path(tmp)
              wix = temp / "wix314-binaries.zip"
              nsis = temp / "nsis-3.13.zip"
              plugin = temp / "nsis_tauri_utils.dll"
              fetch("wixtoolset/wix3", 158158052, wix,
                    sha256="6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31")
              fetch("tauri-apps/binary-releases", 623832696, nsis,
                    sha256="ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8",
                    sha1="db14f8af2ea346b786c6ae19343f61aaf5e09b8e")
              fetch("tauri-apps/nsis-tauri-utils", 345882097, plugin,
                    sha256="5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709",
                    sha1="75197fee3c6a814fe035788d1c34ead39349b860")
              wix_cache = cache / "WixTools314"
              nsis_cache = cache / "NSIS"
              with ZipFile(wix) as archive:
                  archive.extractall(wix_cache)
              with ZipFile(nsis) as archive:
                  archive.extractall(cache)
              (cache / "nsis-3.13").rename(nsis_cache)
              destination = nsis_cache / "Plugins/x86-unicode/additional/nsis_tauri_utils.dll"
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(plugin.read_bytes())
              assert (wix_cache / "candle.exe").is_file()
              assert hashlib.sha1((nsis_cache / "NSIS.exe").read_bytes()).hexdigest() == "6d45d4e8ccf18fe1fdac9164058f356102a2ecf2"
          PYTOOLS
      - run: npm ci
      - name: Package and sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test "$(git rev-parse HEAD)" = a9fbcc59fac1c59a9b2da015079f28e1393a3b8e
          test "$ISHELL_MANAGEMENT_URL" = https://81.70.52.10
          npm run tauri -- build --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: ishell-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.sig
          if-no-files-found: error

  publish:
    name: Verify installers and publish v1.5.16
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.5.16
          persist-credentials: false
      - name: Verify the Linux and macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          original=$(gh run view 42569637138 --json headSha,status,jobs)
          jq -e '.headSha == "a9fbcc59fac1c59a9b2da015079f28e1393a3b8e" and ([.jobs[] | select(.name == "Build macOS Intel" or .name == "Build macOS Arm")] | length == 2 and all(.conclusion == "success"))' <<< "$original" >/dev/null
          for attempt in {1..36}; do
            linux=$(gh run view 42571161323 --json jobs)
            if jq -e 'any(.jobs[]; .name == "Package the v1.5.16 Linux installer" and .conclusion == "success")' <<< "$linux" >/dev/null; then
              exit 0
            fi
            if jq -e 'any(.jobs[]; .name == "Package the v1.5.16 Linux installer" and .status == "completed")' <<< "$linux" >/dev/null; then
              exit 1
            fi
            sleep 10
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: ishell-linux-x64
          github-token: ${{ github.token }}
          run-id: '42571161323'
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: ishell-windows-x64
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          pattern: ishell-macos-*
          github-token: ${{ github.token }}
          run-id: '42569637138'
          path: artifacts/macos
      - name: Validate installers and the signed updater manifest
        shell: bash
        run: |
          set -euo pipefail
          for asset in iShell_1.5.16_aarch64.dmg iShell_1.5.16_x64.dmg iShell_1.5.16_x64-setup.exe iShell_1.5.16_x64_en-US.msi iShell_1.5.16_amd64.deb iShell-1.5.16-1.x86_64.rpm iShell_1.5.16_amd64.AppImage; do
            count=$(find artifacts -type f -name "$asset" | wc -l)
            if [[ "$asset" == *.msi && "$count" -eq 0 ]]; then
              count=$(find artifacts -type f -name 'iShell_1.5.16_x64*.msi' | wc -l)
            fi
            test "$count" -eq 1
          done
          node scripts/build-updater-manifest.mjs --dir artifacts --tag v1.5.16 --repo Raymanhan/ishell --changelog README.zh-CN.md --out artifacts/latest.json
          jq -e '.version == "1.5.16" and (.platforms | keys | sort) == ["darwin-aarch64","darwin-x86_64","linux-x86_64","windows-x86_64"] and (.platforms | all(.signature | length > 0))' artifacts/latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          iShell v1.5.16 接入匿名使用统计。SSH、SFTP 和其他本地功能仍可免登录使用。

          - 安装包会发送匿名心跳，以及部分 SSH 和 SFTP 操作的类型、时间和结果。
          - 上报不包含服务器地址、SSH 用户名、密码、私钥、命令原文、终端输出、文件路径或内容。
          - 可通过启动环境变量 `ISHELL_TELEMETRY_DISABLED` 或应用数据目录中的 `telemetry.disabled` 文件关闭上报。
          NOTES
          mapfile -d '' -t files < <(find artifacts -type f -print0)
          gh release create v1.5.16 "${files[@]}" --verify-tag --latest --title v1.5.16 --notes-file release-notes.md
