name: Recover v1.5.16 Linux installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Package the v1.5.16 Linux installer
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ISHELL_MANAGEMENT_URL: ${{ vars.ISHELL_MANAGEMENT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.5.16
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Fetch and verify the official AppImage tools through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$HOME/.cache/tauri"
          mkdir -p "$tools_dir"
          fetch_asset() {
            local repo="$1" asset="$2" sha="$3" filename="$4" attempt
            for attempt in 1 2 3; do
              if timeout 75 gh api -H 'Accept: application/octet-stream' "repos/$repo/releases/assets/$asset" > "$tools_dir/$filename.part" &&
                printf '%s  %s\n' "$sha" "$tools_dir/$filename.part" | sha256sum --check; then
                install -m 0755 "$tools_dir/$filename.part" "$tools_dir/$filename"
                rm "$tools_dir/$filename.part"
                return
              fi
              sleep "$((attempt * 3))"
            done
            return 1
          }
          fetch_asset tauri-apps/binary-releases 274691722 f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f AppRun-x86_64
          fetch_asset tauri-apps/binary-releases 576945544 36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62 linuxdeploy-07333c6-x86_64.AppImage
          fetch_asset linuxdeploy/linuxdeploy-plugin-appimage 602435573 49d6a17160675a6bd1781699aae6bdf7692d98552e02a3671d2183d10547842e linuxdeploy-plugin-appimage.AppImage
      - run: npm ci
      - name: Package and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test "$(git rev-parse HEAD)" = a9fbcc59fac1c59a9b2da015079f28e1393a3b8e
          test "$ISHELL_MANAGEMENT_URL" = https://81.70.52.10
          npm run tauri -- build --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: ishell-linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.sig
          if-no-files-found: error

  publish:
    name: Verify installers and publish v1.5.16
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.5.16
          persist-credentials: false
      - name: Verify the other three platforms succeeded on the same tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=a9fbcc59fac1c59a9b2da015079f28e1393a3b8e
          for attempt in {1..30}; do
            release_run=$(gh run view 42569637138 --json headSha,status,jobs)
            jq -e --arg sha "$expected" '.headSha == $sha' <<< "$release_run" >/dev/null
            if jq -e '.status == "completed"' <<< "$release_run" >/dev/null; then
              jq -e '([.jobs[] | select(.name == "Build Windows x64" or .name == "Build macOS Intel" or .name == "Build macOS Arm")] | length == 3 and all(.conclusion == "success"))' <<< "$release_run" >/dev/null
              exit 0
            fi
            sleep 10
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: ishell-linux-x64
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: ishell-windows-x64
          github-token: ${{ github.token }}
          run-id: '42569637138'
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          pattern: ishell-macos-*
          github-token: ${{ github.token }}
          run-id: '42569637138'
          path: artifacts/macos
      - name: Validate installers and the signed updater manifest
        shell: bash
        run: |
          set -euo pipefail
          for asset in iShell_1.5.16_aarch64.dmg iShell_1.5.16_x64.dmg iShell_1.5.16_x64-setup.exe iShell_1.5.16_x64_en-US.msi iShell_1.5.16_amd64.deb iShell-1.5.16-1.x86_64.rpm iShell_1.5.16_amd64.AppImage; do
            count=$(find artifacts -type f -name "$asset" | wc -l)
            if [[ "$asset" == *.msi && "$count" -eq 0 ]]; then
              count=$(find artifacts -type f -name 'iShell_1.5.16_x64*.msi' | wc -l)
            fi
            test "$count" -eq 1
          done
          node scripts/build-updater-manifest.mjs --dir artifacts --tag v1.5.16 --repo Raymanhan/ishell --changelog README.zh-CN.md --out artifacts/latest.json
          jq -e '.version == "1.5.16" and (.platforms | keys | sort) == ["darwin-aarch64","darwin-x86_64","linux-x86_64","windows-x86_64"] and (.platforms | all(.signature | length > 0))' artifacts/latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          iShell v1.5.16 接入匿名使用统计。SSH、SFTP 和其他本地功能仍可免登录使用。

          - 安装包会发送匿名心跳，以及部分 SSH 和 SFTP 操作的类型、时间和结果。
          - 上报不包含服务器地址、SSH 用户名、密码、私钥、命令原文、终端输出、文件路径或内容。
          - 可通过启动环境变量 `ISHELL_TELEMETRY_DISABLED` 或应用数据目录中的 `telemetry.disabled` 文件关闭上报。
          NOTES
          mapfile -d '' -t files < <(find artifacts -type f -print0)
          gh release create v1.5.16 "${files[@]}" --verify-tag --latest --title v1.5.16 --notes-file release-notes.md
