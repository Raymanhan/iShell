name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    env:
      ISHELL_MANAGEMENT_URL: ${{ vars.ISHELL_MANAGEMENT_URL }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
            artifact: ishell-windows-x64
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustTargets: x86_64-unknown-linux-gnu
            artifact: ishell-linux-x64
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            rustTargets: x86_64-apple-darwin
            artifact: ishell-macos-intel
          - label: macOS Arm
            os: macos-latest
            target: aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin
            artifact: ishell-macos-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Fetch and verify the official AppImage tools through the GitHub API
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$HOME/.cache/tauri"
          mkdir -p "$tools_dir"
          fetch_asset() {
            local repo="$1" asset="$2" sha="$3" filename="$4" attempt
            for attempt in 1 2 3; do
              if timeout 75 gh api -H 'Accept: application/octet-stream' "repos/$repo/releases/assets/$asset" > "$tools_dir/$filename.part" &&
                printf '%s  %s\n' "$sha" "$tools_dir/$filename.part" | sha256sum --check; then
                install -m 0755 "$tools_dir/$filename.part" "$tools_dir/$filename"
                rm "$tools_dir/$filename.part"
                return
              fi
              sleep "$((attempt * 3))"
            done
            return 1
          }
          fetch_asset tauri-apps/binary-releases 274691722 f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f AppRun-x86_64
          fetch_asset tauri-apps/binary-releases 576945544 36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62 linuxdeploy-07333c6-x86_64.AppImage
          fetch_asset linuxdeploy/linuxdeploy-plugin-appimage 602435573 49d6a17160675a6bd1781699aae6bdf7692d98552e02a3671d2183d10547842e linuxdeploy-plugin-appimage.AppImage

      - name: Fetch and verify the official WiX and NSIS tools
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PYTOOLS'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import time
          from zipfile import ZipFile

          def fetch(repo, asset, path, sha256=None, sha1=None):
              for attempt in range(3):
                  try:
                      with path.open("wb") as stream:
                          subprocess.run(
                              ["gh", "api", "-H", "Accept: application/octet-stream",
                               f"repos/{repo}/releases/assets/{asset}"],
                              stdout=stream, check=True, timeout=90,
                          )
                      break
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                      if attempt == 2:
                          raise
                      time.sleep((attempt + 1) * 3)
              data = path.read_bytes()
              if sha256 is not None and hashlib.sha256(data).hexdigest() != sha256:
                  raise RuntimeError(f"SHA-256 mismatch for {path.name}")
              if sha1 is not None and hashlib.sha1(data).hexdigest() != sha1:
                  raise RuntimeError(f"SHA-1 mismatch for {path.name}")
              print(f"Verified {path.name}", flush=True)

          cache = Path(os.environ["LOCALAPPDATA"]) / "tauri"
          cache.mkdir(parents=True, exist_ok=True)
          with tempfile.TemporaryDirectory() as tmp:
              temp = Path(tmp)
              wix = temp / "wix314-binaries.zip"
              nsis = temp / "nsis-3.13.zip"
              plugin = temp / "nsis_tauri_utils.dll"
              fetch("wixtoolset/wix3", 158158052, wix,
                    sha256="6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31")
              fetch("tauri-apps/binary-releases", 623832696, nsis,
                    sha256="ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8",
                    sha1="db14f8af2ea346b786c6ae19343f61aaf5e09b8e")
              fetch("tauri-apps/nsis-tauri-utils", 345882097, plugin,
                    sha256="5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709",
                    sha1="75197fee3c6a814fe035788d1c34ead39349b860")
              wix_cache = cache / "WixTools314"
              nsis_cache = cache / "NSIS"
              with ZipFile(wix) as archive:
                  archive.extractall(wix_cache)
              with ZipFile(nsis) as archive:
                  archive.extractall(cache)
              (cache / "nsis-3.13").rename(nsis_cache)
              destination = nsis_cache / "Plugins/x86-unicode/additional/nsis_tauri_utils.dll"
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(plugin.read_bytes())
              assert (wix_cache / "candle.exe").is_file()
              assert hashlib.sha1((nsis_cache / "NSIS.exe").read_bytes()).hexdigest() == "6d45d4e8ccf18fe1fdac9164058f356102a2ecf2"
          PYTOOLS

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust backends
        if: runner.os == 'Linux'
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features force-russh -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test Windows SSH backend on Linux
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features force-russh

      # In-app updates need every update package signed with the key whose public
      # half is in tauri.conf.json. Until the key is added as a repository secret
      # the release still builds, just without update packages.
      - name: Configure updater signing
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without in-app update packages."
            echo "build-args=--config src-tauri/tauri.no-updater.conf.json" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build installer
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} ${{ steps.updater.outputs.build-args }}

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app ${{ steps.updater.outputs.build-args }}

      - name: Create macOS DMG and name the update package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            ARCH_SUFFIX="aarch64"
          else
            ARCH_SUFFIX="x64"
          fi

          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/iShell.app"
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          DMG_PATH="${DMG_DIR}/iShell_${VERSION}_${ARCH_SUFFIX}.dmg"

          test -d "${APP_PATH}"
          mkdir -p "${DMG_DIR}"
          hdiutil create -volname "iShell" -srcfolder "${APP_PATH}" -ov -format UDZO "${DMG_PATH}"

          # Both macOS jobs emit iShell.app.tar.gz; give each architecture its own name.
          UPDATE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          if [[ -f "${UPDATE_DIR}/iShell.app.tar.gz" ]]; then
            UPDATE_NAME="iShell_${VERSION}_${ARCH_SUFFIX}.app.tar.gz"
            mv "${UPDATE_DIR}/iShell.app.tar.gz" "${UPDATE_DIR}/${UPDATE_NAME}"
            mv "${UPDATE_DIR}/iShell.app.tar.gz.sig" "${UPDATE_DIR}/${UPDATE_NAME}.sig"
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build updater manifest
        if: hashFiles('artifacts/**/*.sig') != ''
        run: >-
          node scripts/build-updater-manifest.mjs
          --dir artifacts
          --tag "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --changelog README.zh-CN.md
          --out artifacts/latest.json

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          prefix="- \`${GITHUB_REF_NAME}\` "
          while IFS= read -r line; do
            if [[ "$line" == "$prefix"* ]]; then
              printf 'body=%s\n' "${line#"$prefix"}" >> "$GITHUB_OUTPUT"
              break
            fi
          done < README.zh-CN.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: artifacts/**/*
